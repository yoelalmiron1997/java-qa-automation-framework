name: Java QA Automation CI

# Este workflow ejecuta la suite de pruebas automatizadas cada vez que se hace push o se abre un pull request en la rama main.
# Sirve como pipeline de integración continua para validar que el proyecto compila y que los tests web y API siguen funcionando.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1) Descarga el código del repositorio para que el runner pueda trabajar con el proyecto.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Instala Java 17 y configura Maven con caché para acelerar futuras ejecuciones.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3) Instala Google Chrome en el runner. Con Selenium 4, el driver puede resolverse automáticamente con Selenium Manager.
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # 4) Instala xvfb para ejecutar Chrome con una pantalla virtual en Linux.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # 5) Ejecuta la suite de pruebas Maven. Se usa xvfb-run para simular una pantalla virtual mientras Selenium abre Chrome.
      - name: Run Selenium and API tests
        run: xvfb-run -a mvn clean test

      # 7) Guarda los reportes y capturas generadas por Maven como artefactos para revisión posterior.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/screenshots/
